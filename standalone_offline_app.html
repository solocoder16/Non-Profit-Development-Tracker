        eyeOff: <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24 M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68 M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61 M2 2l20 20" />,

      return (
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
          {icons[name] || icons.shield}

    };

    // --- Word Document Export (.doc) Engine ---
    function escapeXml(unsafe = '') {
      return String(unsafe).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
    function downloadWordDoc(filename, title, contentHtml) {
      const fileContent = `<!DOCTYPE html>
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
  <meta charset='utf-8'><title>${escapeXml(title)}</title>
  <style>
    @page { size: letter; margin: 0.8in; }
    body { font-family: 'Calibri', Arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #1e293b; }
    .org-header { border-bottom: 2pt solid #047857; padding-bottom: 8pt; margin-bottom: 16pt; }
    .org-title { font-size: 15pt; font-weight: bold; color: #047857; margin: 0; }
    h1 { font-size: 18pt; font-weight: bold; color: #0f172a; margin-bottom: 6pt; }
    h2 { font-size: 12pt; font-weight: bold; color: #047857; border-bottom: 1pt solid #cbd5e1; padding-bottom: 3pt; margin-top: 14pt; }
    table { width: 100%; border-collapse: collapse; margin: 8pt 0 14pt 0; }
    th, td { border: 1pt solid #cbd5e1; padding: 6pt 8pt; font-size: 10pt; vertical-align: top; }
    th { background-color: #f1f5f9; font-weight: bold; }
    .footer { border-top: 1pt solid #cbd5e1; margin-top: 24pt; padding-top: 8pt; font-size: 9pt; }
  </style>
</head>
<body>${contentHtml}</body></html>`;
      const blob = new Blob(['\ufeff', fileContent], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
    }

    // --- Initial Seed Data ---
    const DEFAULT_COMMUNITIES = [

    const DEFAULT_POLICIES = [

    ];

    const INITIAL_CHILDREN = [
      {
        id: 'ch-1', beneficiaryName: 'Jasmine Alcantara Dela Cruz', beneficiaryCode: 'VIN-CL-2024-001', nickname: 'Jas',

    const INITIAL_VOLUNTEERS = [
      {

        characterReferences: [{ name: 'Principal Anita Reyes', relationship: 'Department Head', organization: 'DepEd Binan', phone: '0919-445-1200' }]
      },
      {
        id: 'vol-2', volunteerCode: 'VIN-VOL-2024-002', fullName: 'Joshua Miguel Tan', preferredName: 'Josh', gender: 'Male',
        birthdate: '2002-11-23', age: 22, contactNumber: '0918-933-7721', email: 'josh.tan2002@outlook.com',
        address: 'Area C, Towerville Phase 4', barangayCommunity: 'Towerville, San Jose Del Monte Bulacan',
        occupation: 'BS Information Technology Student', engagementType: 'one_time', status: 'completed',
        enrolledByOfficer: 'Jericho (Project Officer)', enrollmentDate: '2024-07-05',

    const INITIAL_REPORTS = [
      {
        id: 'rep-1', title: 'Citizen Voice and Action: Community Scorecard Dialogue for Barangay Health and Child Protection',
        program: 'cva', date: '2024-09-14', location: 'Barangay Multi-Purpose Center, Community Hall',

        challengesAndAdaptations: 'Addressed initial apprehension through standard government service indicators.',
        metrics: [{ label: 'Citizen Participants', value: '240', unit: 'residents' }, { label: 'Scorecard Dialogue', value: '100%', unit: 'completed' }],
        communityVoiceQuote: { quote: 'Through Citizen Voice and Action, our barangay officials sat down with us as partners.', author: 'Nanay Corazon (47)', role: 'Community Health Monitor' },
        tags: ['CVA', 'Social Accountability', 'Health Rights'], coverImage: ''
      }
    ];

    // --- Main Standalone App Component ---
    function StandaloneApp() {
      // Data state loaded from LocalStorage
      const [children, setChildren] = useState(() => {
        const saved = localStorage.getItem('vineyard_children');
        return saved ? JSON.parse(saved) : INITIAL_CHILDREN;
      });
      const [volunteers, setVolunteers] = useState(() => {
        const saved = localStorage.getItem('vineyard_volunteers');
        return saved ? JSON.parse(saved) : INITIAL_VOLUNTEERS;
      });
      const [reports, setReports] = useState(() => {
        const saved = localStorage.getItem('vineyard_reports');
        return saved ? JSON.parse(saved) : INITIAL_REPORTS;
      });
      const [communities, setCommunities] = useState(() => {
        const saved = localStorage.getItem('vineyard_communities');
        return saved ? JSON.parse(saved) : DEFAULT_COMMUNITIES;
      });
      const [policies, setPolicies] = useState(() => {
        const saved = localStorage.getItem('vineyard_policies');
        return saved ? JSON.parse(saved) : DEFAULT_POLICIES;
      });
      const [auditLogs, setAuditLogs] = useState(() => {
        const saved = localStorage.getItem('vineyard_audit_logs');
        return saved ? JSON.parse(saved) : [
          { id: 'log-1', timestamp: new Date().toISOString(), action: 'System Loaded', details: 'Initialized standalone offline workstation masterlist', officer: 'Jericho (Project Officer)' }
        ];
      });

      // App Settings
      const [activeTab, setActiveTab] = useState('childlink'); // 'childlink' | 'volunteers' | 'reports' | 'security'
      const [privacyMode, setPrivacyMode] = useState(false);
      const [isLocked, setIsLocked] = useState(false);
      const [pinCode, setPinCode] = useState('1234');
      const [enteredPin, setEnteredPin] = useState('');
      const [pinError, setPinError] = useState(false);

      // File System Access API Handle (In-Memory direct stream handle)
      const [fileHandle, setFileHandle] = useState(null);
      const [fileHandleName, setFileHandleName] = useState('Local Browser Cache (Standalone)');
      const [isAutoSaving, setIsAutoSaving] = useState(false);

      // Modals
      const [selectedChildDossier, setSelectedChildDossier] = useState(null);
      const [isChildModalOpen, setIsChildModalOpen] = useState(false);
      const [childToEdit, setChildToEdit] = useState(null);

      const [selectedVolDossier, setSelectedVolDossier] = useState(null);
      const [isVolModalOpen, setIsVolModalOpen] = useState(false);
      const [volToEdit, setVolToEdit] = useState(null);

      const [selectedReportDetail, setSelectedReportDetail] = useState(null);
      const [isReportComposeOpen, setIsReportComposeOpen] = useState(false);
      const [reportToEdit, setReportToEdit] = useState(null);

      // Log Audit Helper
      const logAudit = (action, details) => {
        const entry = { id: `log-${Date.now()}`, timestamp: new Date().toISOString(), action, details, officer: 'Jericho (Project Officer)' };
        setAuditLogs(prev => [entry, ...prev.slice(0, 99)]);
      };

      // Persistent LocalStorage Auto-Sync
      useEffect(() => {
        localStorage.setItem('vineyard_children', JSON.stringify(children));
        localStorage.setItem('vineyard_volunteers', JSON.stringify(volunteers));
        localStorage.setItem('vineyard_reports', JSON.stringify(reports));
        localStorage.setItem('vineyard_communities', JSON.stringify(communities));
        localStorage.setItem('vineyard_policies', JSON.stringify(policies));
        localStorage.setItem('vineyard_audit_logs', JSON.stringify(auditLogs));

        // Stream directly to local disk if File Handle was selected via File System Access API
        if (fileHandle) {
          (async () => {
            try {
              setIsAutoSaving(true);
              const writable = await fileHandle.createWritable();
              const fullData = { version: '1.0', organization: 'Vineyard Humanitarian Operations', lastSaved: new Date().toISOString(), children, volunteers, reports, communities, policies, auditLogs };
              await writable.write(JSON.stringify(fullData, null, 2));
              await writable.close();
            } catch (err) {
              console.warn("Direct stream disk write failed:", err);
            } finally {
              setTimeout(() => setIsAutoSaving(false), 400);
            }
          })();
        }
      }, [children, volunteers, reports, communities, policies, auditLogs, fileHandle]);

      // Direct Disk File Picker (window.showSaveFilePicker)
      const handleSelectLocalDiskFile = async () => {
        if ('showSaveFilePicker' in window) {
          try {
            const handle = await window.showSaveFilePicker({
              suggestedName: 'vineyard_masterlist.json',
              types: [{ description: 'JSON Database File', accept: { 'application/json': ['.json'] } }]
            });
            setFileHandle(handle);
            setFileHandleName(handle.name || 'C:\\WebApp Data\\vineyard_masterlist.json');
            logAudit('Disk Stream Connected', `Connected direct persistent disk stream to ${handle.name}`);
            alert(`Connected direct background stream to "${handle.name}". Every change will now save directly to your disk!`);
          } catch (err) {
            if (err.name !== 'AbortError') console.error(err);
          }
        } else {
          alert('Modern File System Access API is not active in this browser mode. Standard local browser persistence and the manual Export Backup button are fully active!');
        }
      };

      // Full Manual Export Backup
      const handleExportBackup = () => {
        const fullData = { version: '1.0', organization: 'Vineyard Humanitarian Operations', backupDate: new Date().toISOString(), children, volunteers, reports, communities, policies, auditLogs };
        const blob = new Blob([JSON.stringify(fullData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `vineyard_masterlist_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        logAudit('Backup Exported', 'Exported full masterlist database backup JSON file');
      };

      // Full Manual Import / Restore
      const handleImportBackup = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data.children) setChildren(data.children);
            if (data.volunteers) setVolunteers(data.volunteers);
            if (data.reports) setReports(data.reports);
            if (data.communities) setCommunities(data.communities);
            if (data.policies) setPolicies(data.policies);
            logAudit('Backup Restored', `Restored masterlist database from file: ${file.name}`);
            alert('Database successfully restored from backup file!');
          } catch (err) {
            alert('Invalid backup JSON format.');
          }
        };
        reader.readAsText(file);
      };

      // Privacy mask helper
      const mask = (text) => {
        if (!privacyMode || !text) return text;
        const words = String(text).split(' ');
        return words.map(w => w.length > 2 ? `${w[0]}${'*'.repeat(Math.max(w.length - 2, 2))}${w[w.length - 1]}` : '***').join(' ');
      };

      // PIN Unlock
      const handleUnlock = (e) => {
        e.preventDefault();
        if (enteredPin === pinCode) {
          setIsLocked(false);
          setEnteredPin('');
          setPinError(false);
          logAudit('Security Unlock', 'Workstation console unlocked via PIN');
        } else {
          setPinError(true);
        }
      };

      // Hotkeys (Alt+P for Privacy, Alt+L for Lock)
      useEffect(() => {
        const onKeyDown = (e) => {
          if (e.altKey && (e.key === 'p' || e.key === 'P')) {
            e.preventDefault();
            setPrivacyMode(prev => !prev);
          }
          if (e.altKey && (e.key === 'l' || e.key === 'L')) {
            e.preventDefault();
            setIsLocked(true);
          }
        };
        window.addEventListener('keydown', onKeyDown);
        return () => window.removeEventListener('keydown', onKeyDown);
      }, []);

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800">
          
          {/* Top Bar Header */}
          <header className="sticky top-0 z-40 bg-white border-b border-slate-200 shadow-xs no-print">
            {privacyMode && (
              <div className="bg-amber-500 text-white text-xs font-semibold py-1 px-4 flex items-center justify-between">
                <span>Privacy Masking Active: Beneficiary names, addresses, and sensitive fields are obscured.</span>
                <button onClick={() => setPrivacyMode(false)} className="underline hover:text-amber-100 font-bold text-xs">Disable</button>
              </div>
            )}
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-9 h-9 rounded-xl bg-emerald-700 text-white flex items-center justify-center font-bold text-lg shadow-sm">V</div>

                <div className="p-8 overflow-y-auto space-y-6 text-sm">
                  <div className="border-b-2 border-emerald-700 pb-4">
                    <h1 className="text-2xl font-black text-slate-900">{mask(selectedChildDossier.beneficiaryName)}</h1>
                    <p className="text-xs text-slate-500 mt-1">Known as &ldquo;{selectedChildDossier.nickname}&rdquo; · {selectedChildDossier.communityCluster}</p>
                  </div>
                  <div className="grid grid-cols-2 gap-4 text-xs">
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <p><strong>Age &amp; Grade:</strong> {selectedChildDossier.age} yrs old, {selectedChildDossier.gradeLevel}</p>
                      <p><strong>Favorite Subject:</strong> {selectedChildDossier.favoriteSubject || '—'}</p>
                      <p><strong>Household Chores:</strong> {selectedChildDossier.householdChores || '—'}</p>
                    </div>
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <p><strong>Father:</strong> {mask(selectedChildDossier.fatherNameOccupation)}</p>
                      <p><strong>Mother:</strong> {mask(selectedChildDossier.motherNameOccupation)}</p>
                      <p><strong>Siblings:</strong> {selectedChildDossier.siblings || '—'}</p>
                    </div>
                  </div>
                  <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-xs">
                    <strong className="text-emerald-950 block mb-1">Safeguarding &amp; Policy Compliance:</strong>
                    <span className="text-emerald-800">✓ Signed Vineyard Child Protection Policy · ✓ Media Release Form Signed</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Volunteer Dossier Modal */}
          {selectedVolDossier && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full border border-slate-200 overflow-hidden my-auto max-h-[95vh] flex flex-col">
                <div className="px-6 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50 no-print">
                  <span className="text-xs font-mono font-bold text-emerald-800">{selectedVolDossier.volunteerCode}</span>
                  <div className="flex items-center gap-2">
                    <button onClick={() => {
                      const html = `<h1>Volunteer Dossier: ${selectedVolDossier.fullName}</h1><p>ID: ${selectedVolDossier.volunteerCode}</p><p>Engagement: ${selectedVolDossier.engagementType}</p><p>Tracks: ${(selectedVolDossier.volunteerTracks || []).join(', ')}</p><p>Emergency Contact: ${selectedVolDossier.emergencyContact?.name} (${selectedVolDossier.emergencyContact?.primaryPhone})</p>`;
                      downloadWordDoc(`Volunteer_${selectedVolDossier.volunteerCode}.doc`, selectedVolDossier.fullName, html);
                    }} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold">Download Word (.doc)</button>
                    <button onClick={() => window.print()} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-semibold">Print</button>
                    <button onClick={() => setSelectedVolDossier(null)} className="p-1 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                  </div>
                </div>
                <div className="p-8 overflow-y-auto space-y-6 text-sm">
                  <div className="border-b-2 border-emerald-700 pb-4">
                    <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold border mb-2 inline-block ${selectedVolDossier.engagementType === 'long_term' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' : 'bg-blue-50 text-blue-800 border-blue-300'}`}>
                      {selectedVolDossier.engagementType === 'long_term' ? 'Long-Term Volunteer' : 'One-Time Event Volunteer'}
                    </span>
                    <h1 className="text-2xl font-black text-slate-900">{mask(selectedVolDossier.fullName)}</h1>
                    <p className="text-xs text-slate-500 mt-1">Status: {selectedVolDossier.status.toUpperCase()} · Enrolled: {selectedVolDossier.enrollmentDate}</p>
                  </div>
                  <div className="grid grid-cols-2 gap-4 text-xs">
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <p><strong>Contact Phone:</strong> {mask(selectedVolDossier.contactNumber)}</p>
                      <p><strong>Email:</strong> {selectedVolDossier.email || '—'}</p>
                      <p><strong>Community:</strong> {selectedVolDossier.barangayCommunity}</p>
                      <p><strong>Occupation:</strong> {selectedVolDossier.occupation || '—'}</p>
                    </div>
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                      <p><strong>Emergency Contact:</strong> {selectedVolDossier.emergencyContact?.name} ({selectedVolDossier.emergencyContact?.relationship})</p>
                      <p><strong>Emergency Phone:</strong> {mask(selectedVolDossier.emergencyContact?.primaryPhone)}</p>
                      <p><strong>Blood Type:</strong> {selectedVolDossier.bloodType || 'Unknown'}</p>
                    </div>
                  </div>
                  <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs space-y-2">
                    <p><strong>Assigned Tracks:</strong> {(selectedVolDossier.volunteerTracks || []).join(', ')}</p>
                    <p><strong>Core Skills:</strong> {(selectedVolDossier.skills || []).join(' · ')}</p>
                    <p><strong>Availability:</strong> {(selectedVolDossier.availabilityDays || []).join(', ')} ({selectedVolDossier.availabilityHoursPerWeek})</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Report Detail Modal */}
          {selectedReportDetail && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 overflow-y-auto">
              <div className="bg-white rounded-2xl shadow-2xl max-w-3xl w-full border border-slate-200 overflow-hidden my-auto max-h-[95vh] flex flex-col">
                <div className="px-6 py-3 border-b border-slate-200 flex items-center justify-between bg-slate-50 no-print">
                  <span className="text-xs font-bold text-emerald-800 uppercase">{selectedReportDetail.program === 'cva' ? 'Citizen Voice and Action' : 'Education in Emergencies'}</span>
                  <div className="flex items-center gap-2">
                    <button onClick={() => {
                      const html = `<h1>${selectedReportDetail.title}</h1><p>Date: ${selectedReportDetail.date}</p><p>Summary: ${selectedReportDetail.summary}</p><p>Context: ${selectedReportDetail.situationOverview}</p><p>Action Taken: ${selectedReportDetail.actionTaken}</p>`;
                      downloadWordDoc(`Report_${selectedReportDetail.id}.doc`, selectedReportDetail.title, html);
                    }} className="px-3 py-1.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold">Download Word (.doc)</button>
                    <button onClick={() => window.print()} className="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-xs font-semibold">Print</button>
                    <button onClick={() => setSelectedReportDetail(null)} className="p-1 text-slate-400 hover:text-slate-600"><Icon name="x" className="w-5 h-5" /></button>
                  </div>
                </div>
                <div className="p-8 overflow-y-auto space-y-6 text-sm">
                  <h1 className="text-2xl font-black text-slate-900 leading-tight">{selectedReportDetail.title}</h1>
                  <p className="text-xs text-slate-500">Date: {selectedReportDetail.date} · Location: {selectedReportDetail.location} · Officer: {selectedReportDetail.officerName}</p>
                  <div className="p-4 bg-emerald-50 rounded-xl border border-emerald-200 text-slate-800 font-medium">{selectedReportDetail.summary}</div>
                  <div>
                    <h3 className="font-bold text-slate-900 text-sm mb-1">1. Context &amp; Vulnerability Assessment</h3>
                    <p className="text-xs text-slate-700 leading-relaxed">{selectedReportDetail.situationOverview}</p>
                  </div>
                  <div>
                    <h3 className="font-bold text-slate-900 text-sm mb-1">2. Operational Deployment &amp; Response</h3>
                    <p className="text-xs text-slate-700 leading-relaxed">{selectedReportDetail.actionTaken}</p>
                  </div>
                  {selectedReportDetail.communityVoiceQuote && (
                    <div className="p-4 bg-slate-50 border-l-4 border-emerald-600 text-xs italic">
                      &ldquo;{selectedReportDetail.communityVoiceQuote.quote}&rdquo; — <strong>{selectedReportDetail.communityVoiceQuote.author}</strong> ({selectedReportDetail.communityVoiceQuote.role})
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* PIN Lock Screen Modal */}
          {isLocked && (
            <div className="fixed inset-0 z-50 bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
              <form onSubmit={handleUnlock} className="bg-white rounded-2xl p-6 sm:p-8 max-w-sm w-full text-center space-y-4 shadow-2xl">
                <div className="w-12 h-12 bg-emerald-100 text-emerald-800 rounded-2xl flex items-center justify-center mx-auto"><Icon name="lock" className="w-6 h-6" /></div>
                <div>
                  <h2 className="text-lg font-bold text-slate-900">Console Locked</h2>
                  <p className="text-xs text-slate-500 mt-1">Enter your officer PIN code to resume session (Default: 1234).</p>
                </div>
                <input
                  type="password"
                  maxLength="6"
                  autoFocus
                  placeholder="PIN"
                  value={enteredPin}
                  onChange={e => setEnteredPin(e.target.value)}
                  className="w-full text-center text-2xl font-mono tracking-widest px-4 py-2 border rounded-xl border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500"
                />
                {pinError && <p className="text-xs text-rose-600 font-bold">Incorrect PIN code. Try again.</p>}
                <button type="submit" className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl transition-colors cursor-pointer">
                  Unlock Console
                </button>
              </form>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<StandaloneApp />);
  </script>
</body>
</html>
